name = "atio-asset-proxy"
main = "cloudflare-worker.js"
compatibility_date = "2026-07-01"

[[routes]]
pattern = "assets.atio.dev"
custom_domain = true

[vars]
HETZNER_ENDPOINT = "fsn1.your-objectstorage.com"
HETZNER_BUCKET = "atio-configurator"
ALLOWED_ORIGIN = "https://atio.it,https://8b234f.myshopify.com,http://localhost:8080"
CACHE_TTL_SECONDS = "86400"

# Secrets - never put these in this file. Set them with:
#   wrangler secret put SIGNING_SECRET
#   wrangler secret put HETZNER_ACCESS_KEY
#   wrangler secret put HETZNER_SECRET_KEY
